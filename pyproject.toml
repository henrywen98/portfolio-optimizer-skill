[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimizer-skill"
version = "3.0.0"
description = "No-API-key multi-market portfolio optimizer as a Claude Code skill (US / A-shares / HK, auto data fallback)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Henry Wen", email = "henrywen98@users.noreply.github.com"}]
keywords = [
    "portfolio", "optimization", "sharpe-ratio", "efficient-frontier",
    "finance", "investment", "quantitative", "stocks", "us-stocks", "a-shares",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.21",
    "scipy>=1.7",
    "PyPortfolioOpt>=1.5.5",
    "requests>=2.28",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "akshare>=1.12.0"]
calendars = ["pandas-market-calendars>=4.3"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=22.0", "isort>=5.0", "flake8>=5.0"]

[project.urls]
Homepage = "https://github.com/henrywen98/portfolio-optimizer-skill"
Repository = "https://github.com/henrywen98/portfolio-optimizer-skill.git"
Issues = "https://github.com/henrywen98/portfolio-optimizer-skill/issues"

[tool.setuptools]
packages = ["portfolio_engine"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["portfolio_engine"]
